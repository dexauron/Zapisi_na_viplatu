# Выкладка интерфейса на GitHub Pages из main.
# Адрес проекта и публичный ключ берутся из переменных репозитория
# (Settings → Secrets and variables → Actions → Variables): SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
# У этого процесса нет доступа к серверу и базе — только к файлам интерфейса.
name: Выкладка на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Собрать сайт и config.js из переменных репозитория
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # убрать случайные пробелы, переносы и хвост «/» или «/rest/v1» при вставке
          SUPABASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed -E 's#/rest/v1/?$##; s#/+$##')
          SUPABASE_PUBLISHABLE_KEY=$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Нет переменных SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL должен быть https://<ref>.supabase.co, сейчас начинается с «${SUPABASE_URL:0:30}»"; exit 1;; esac
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "::error::Нужен публичный ключ sb_publishable_…, не секретный"; exit 1;; esac
          mkdir _site
          cp -r index.html app.html list.html admin.html sw.js manifest.webmanifest assets vendor .nojekyll _site/
          rm -f _site/assets/config.example.js
          # новая версия файлов при каждой выкладке — браузер не возьмёт старый CSS/JS из кэша
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(assets/[^\"?]+|vendor/[^\"?]+|manifest\.webmanifest)\"#\1=\"\2?v=$v\"#g" _site/*.html
          sed -i "s#vendor/xlsx.core.min.js'#vendor/xlsx.core.min.js?v=$v'#" _site/assets/app.js
          printf "window.APP_CONFIG = {\n  SUPABASE_URL: '%s',\n  SUPABASE_KEY: '%s',\n};\n" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > _site/assets/config.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
