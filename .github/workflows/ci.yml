# Проверки на каждый push и pull request.
# Сторонние действия закреплены по хэшу коммита; версия — в комментарии.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Интерфейс — синтаксис и состав сайта
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Синтаксис JS
        run: for f in assets/*.js; do node --check "$f"; done
      - name: Все подключённые файлы существуют, ключей в коде нет
        run: |
          for page in index.html app.html list.html; do
            grep -oE '(src|href)="[^":#]+"' "$page" | cut -d'"' -f2 | while read -r f; do
              [ "$f" = "assets/config.js" ] && continue
              [ -e "$f" ] || { echo "::error::$page ссылается на отсутствующий $f"; exit 1; }
            done
          done
          if grep -rnE 'sb_publishable_[A-Za-z0-9_-]{10,}|sb_secret_|service_role' assets/*.js index.html app.html list.html; then
            echo "::error::Ключ Supabase в коде интерфейса — он должен приходить из переменных GitHub"; exit 1
          fi

  database:
    name: База — миграции и тесты прав
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Локальная база Supabase с нашими миграциями
        run: supabase start -x gotrue,realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: RLS на всех таблицах и тесты прав
        run: supabase/tests/run.sh

  functions:
    name: Серверные функции — типы и линтер
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
      - run: deno check supabase/functions/staff-admin/index.ts
      - run: deno lint supabase/functions

  secrets:
    name: Поиск секретов (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks по всей истории
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1
