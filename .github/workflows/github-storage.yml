# Подготовленный обработчик. Пока переменная включения не задана, задания не запускаются.
# Этот workflow не переключает интерфейс и не читает рабочий Supabase.
name: Очередь зашифрованного хранилища

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: sverka-github-data
  cancel-in-progress: false

jobs:
  process:
    if: vars.SVERKA_GITHUB_STORAGE_ENABLED == 'true' && (github.event_name != 'issues' || github.event.issue.title == 'sverka-command-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --prefix scripts/github --ignore-scripts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0
      - name: Одноразовый PostgreSQL с прежними правилами выплат
        run: supabase start -x gotrue,realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Проверить очередь и атомарно сохранить результаты
        env:
          SVERKA_GITHUB_STORAGE_ENABLED: ${{ vars.SVERKA_GITHUB_STORAGE_ENABLED }}
          SVERKA_STORE: ${{ vars.SVERKA_STORE }}
          SVERKA_STATE_KEY: ${{ secrets.SVERKA_STATE_KEY }}
          SVERKA_BROKER_PRIVATE_KEY: ${{ secrets.SVERKA_BROKER_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/github/worker.cjs
